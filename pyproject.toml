[project]
name = "bbs"
version = "0.1.0"
description = ""
authors = [{ name = "Nikolai R Kristiansen", email = "nikolaik@gmail.com" }]
requires-python = ">=3.8,<3.9"
license = "MIT"
dependencies = [
    "django-cors-headers>=3.10.0,<4",
    "django-extensions>=3.1.3,<4",
    "django-rename-app>=0.1.3,<0.2",
    "Django==4.2.*",
    "easy-thumbnails>=2.8.1,<3",
    "gunicorn>=20.1.0,<21",
    "mysqlclient>=2.0.3,<3",
    "Pillow>=9.0.0,<10",
    "sentry-sdk>=1.5.5,<2",
    "strawberry-graphql-django>=0.2.5,<0.3",
    "strawberry-graphql>=0.97.0,<0.98",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "bbs.settings"

[dependency-groups]
dev = [
    "ruff",
    "pytest-django",
    "pytest",
]

