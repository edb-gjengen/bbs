mutation updateProduct($productId: ID!, $data: ProductInput!) {
  updateProduct(productId: $productId, data: $data) {
    ... on SaveProductSuccess {
      product {
        id
        name
        salePriceInt
        salePriceExt
        volumeLiter
        alcoholPercent
        description
        active
        inventoryAmount
        updated
      }
    }
    ... on FormErrors {
      message
      fields {
        field
        message
      }
    }
  }
}
