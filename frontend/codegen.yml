schema: ../schema.graphql
documents: ./src/**/*.graphql
generates:
  ./src/types.ts:
    plugins:
      - typescript:
          typesPrefix: Schema
          scalars:
            DateTime:
              input: string
              output: string
            JSONScalar:
              input: unknown
              output: "Array<{ name: string; count: number }>"
      - typescript-operations:
          nonOptionalTypename: true
          scalars:
            DateTime:
              input: string
              output: string
            JSONScalar:
              input: unknown
              output: "Array<{ name: string; count: number }>"
      - typed-document-node
